title: Sumit Gupta
description: Notes on reverse engineering, systems security, and AI security.
url: https://sumitguptaaa.github.io
baseurl: ""
author: Sumit Gupta
email: sijsumitgupta@gmail.com
github_username: sumitguptaaa
linkedin_url: https://www.linkedin.com/in/sumittguptaaa
lang: en

markdown: kramdown
highlighter: rouge
permalink: /writing/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/social-card.jpg
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
