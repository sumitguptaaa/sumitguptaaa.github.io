<!doctype html>
<html lang="en">
  <head>
    {% include head.html %}
  </head>
  <body class="layout-{{ page.layout | default: 'page' }}">
    <a class="skip-link" href="#content">skip to content</a>

    <div class="site-shell">
      <header class="site-header">
        <a class="site-name" href="{{ '/' | relative_url }}"><span class="signal-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>sumit gupta</span></a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a{% if page.url == '/writing/' or page.layout == 'post' %} aria-current="page"{% endif %} href="{{ '/writing/' | relative_url }}">writing</a>
          <a{% if page.url == '/projects/' or page.layout == 'project' %} aria-current="page"{% endif %} href="{{ '/projects/' | relative_url }}">projects</a>
          <a{% if page.url == '/about/' %} aria-current="page"{% endif %} href="{{ '/about/' | relative_url }}">about</a>
          <a href="https://github.com/{{ site.github_username }}">github</a>
        </nav>
      </header>

      <main id="content" class="site-content">
        {{ content }}
      </main>

      <footer class="site-footer">
        <span>&copy; {{ site.time | date: '%Y' }} sumit gupta</span>
        <span>reverse engineering / systems security / ai security</span>
        <nav aria-label="Contact links">
          <a href="https://github.com/{{ site.github_username }}">github</a>
          <a href="{{ site.linkedin_url }}">linkedin</a>
          <a href="mailto:{{ site.email }}">email</a>
        </nav>
      </footer>
    </div>
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
    {% if page.evidence %}<script src="{{ '/assets/js/evidence-lens.js' | relative_url }}" defer></script>{% endif %}
  </body>
</html>
