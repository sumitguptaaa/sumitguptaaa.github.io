---
layout: default
---

<article class="article project-page">
  <header class="article-header">
    <p class="eyebrow"><span>system record</span>{% if page.order %}<span>0{{ page.order }}</span>{% endif %}{% if page.status %}<span>{{ page.status }}</span>{% endif %}</p>
    <h1>{{ page.title }}</h1>
    <p class="article-description">{{ page.description }}</p>
    {% if page.repository %}<p><a class="text-link" href="{{ page.repository }}">inspect repository <span aria-hidden="true">&#8599;</span></a></p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <footer class="article-footer">
    <a href="{{ '/projects/' | relative_url }}">&larr; projects</a>
  </footer>
</article>
